name: Build release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      # app/build.gradle.kts reads the signing entries from local.properties.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "MIRROR_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "MIRROR_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MIRROR_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "MIRROR_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> local.properties

      - run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
