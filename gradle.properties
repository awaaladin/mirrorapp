org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# This sandboxed environment kills background daemon processes on session interruption,
# which crashes normal Gradle/Kotlin-daemon builds mid-compile. Run Kotlin compilation
# in-process instead of spawning a separate long-lived Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
